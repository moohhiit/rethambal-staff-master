name: Sync GitHub to GitLab (Final Stable)

on:
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync to GitLab
        env:
          GITLAB_REPO: ${{ secrets.GITLAB_REPO_URL }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          echo "🚀 Starting clean sync..."

          # Clone GitLab repo OUTSIDE workspace
          git clone https://oauth2:${GITLAB_TOKEN}@${GITLAB_REPO} ../gitlab-repo
          cd ../gitlab-repo

          # Git identity (MUST here)
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

          echo "🧹 Cleaning unwanted files..."

          # Remove ignored tracked files
          if [ -f "$GITHUB_WORKSPACE/.syncignore" ]; then
            while read pattern; do
              [ -n "$pattern" ] && git rm -r --cached "$pattern" 2>/dev/null || true
            done < "$GITHUB_WORKSPACE/.syncignore"
          fi

          # Extra cleanup
          git rm -r --cached .github 2>/dev/null || true
          git rm -r --cached gitlab-repo 2>/dev/null || true

          # Remove nested folder physically
          rm -rf gitlab-repo

          # Remove empty directories
          find . -type d -empty -delete

          echo "📦 Syncing files from GitHub..."

          # 🔥 MAIN FIX: Only rsync (NO MERGE)
          rsync -av --delete \
            --exclude-from="$GITHUB_WORKSPACE/.syncignore" \
            $GITHUB_WORKSPACE/ ./

          git add .

          # Debug (optional but useful)
          git status

          if git diff --cached --quiet; then
            echo "❌ No changes detected"
          else
            git commit -m "🚀 Sync from GitHub"
            git push origin main
          fi

          echo "🎉 Sync completed successfully!"
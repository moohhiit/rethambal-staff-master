name: Sync GitHub to GitLab

on:
  push:
    branches:
      - main  

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub Repo
        uses: actions/checkout@v4

      - name: Sync to GitLab
        env:
          GITLAB_REPO: gitlab.com/moohhiit/rethambal-slave.git
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          echo " Starting sync..."

          # Clone GitLab repo
          git clone https://oauth2:${GITLAB_TOKEN}@${GITLAB_REPO} gitlab-repo

          # Remove .git to avoid submodule issue
          rm -rf gitlab-repo/.git

          # Copy files (respect .syncignore)
          rsync -av --delete --exclude-from='.syncignore' ./ gitlab-repo/

          cd gitlab-repo

          # Initialize fresh repo
          git init
          git branch -M main
          git remote add origin https://oauth2:${GITLAB_TOKEN}@${GITLAB_REPO}

          git config user.name "Sync Bot"
          git config user.email "sync-bot@example.com"

          git add .

          # Commit only if changes exist
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-sync from GitHub"
            git push origin main --force
          fi

          echo "🎉 Sync completed!"
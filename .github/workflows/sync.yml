name: Sync GitHub to GitLab (Optimized + Clean)

on:
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync to GitLab
        env:
            GITLAB_REPO: ${{ secrets.GITLAB_REPO_URL }}
            GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          echo "🚀 Starting optimized sync with cleaning..."

          # Clone GitLab repo outside workspace
          git clone https://oauth2:${GITLAB_TOKEN}@${GITLAB_REPO} ../gitlab-repo
          cd ../gitlab-repo

          # Ensure full history
          git fetch --unshallow || true

          # Add GitHub as remote
          git remote add github $GITHUB_SERVER_URL/$GITHUB_REPOSITORY || true
          git fetch github

          git checkout main

          # Merge changes (GitHub wins)
          git merge github/main -X theirs --allow-unrelated-histories -m "🔄 Sync from GitHub"

          # =========================
          # 🔥 CLEANING STEP START
          # =========================

          echo "🧹 Cleaning unwanted files..."

          # Remove ignored tracked files (IMPORTANT)
          if [ -f "$GITHUB_WORKSPACE/.syncignore" ]; then
            while read pattern; do
              git rm -r --cached "$pattern" 2>/dev/null || true
            done < "$GITHUB_WORKSPACE/.syncignore"
          fi
         
          rm -rf gitlab-repo
          # Extra safety cleanup
          git rm -r --cached .github 2>/dev/null || true
          git rm -r --cached gitlab-repo 2>/dev/null || true

          # Remove empty dirs (optional cleanup)
          find . -type d -empty -delete

          # =========================
          # 🔥 CLEANING STEP END
          # =========================

          # Apply rsync (sync only allowed files)
          rsync -av --delete \
            --exclude-from="$GITHUB_WORKSPACE/.syncignore" \
            $GITHUB_WORKSPACE/ ./

          # Git config
          git config user.name "Sync Bot"
          git config user.email "sync-bot@example.com"

          git add .

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🚀 Sync + Clean from GitHub"
            git push origin main --force
          fi

          echo "🎉 Sync + Clean completed!"
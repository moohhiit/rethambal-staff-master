name: Smart Sync (Independent + Filtered)

on:
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      # ✅ Step 1: Checkout GitHub
      - name: Checkout GitHub Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Smart Sync to GitLab
        env:
          GITLAB_REPO: ${{ secrets.GITLAB_REPO_URL }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          echo "🚀 Smart Sync Started..."

          # =========================
          # 🔥 STEP 1: PREPARE CLEAN SNAPSHOT
          # =========================
          mkdir clean
          
          rsync -av \
            --exclude-from=".syncignore" \
            ./ clean/

          cd clean

          # Remove .git (important for independent history)
          rm -rf .git

          echo "✅ Clean snapshot ready"

          # =========================
          # 🔥 STEP 2: CLONE GITLAB
          # =========================
          git clone https://oauth2:${GITLAB_TOKEN}@${GITLAB_REPO} ../gitlab-repo
          cd ../gitlab-repo

          # Git identity
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

          # =========================
          # 🔥 STEP 3: CLEAN GITLAB (only tracked unwanted)
          # =========================
          echo "🧹 Cleaning GitLab repo..."

          if [ -f "$GITHUB_WORKSPACE/.syncignore" ]; then
            while read pattern; do
              [ -n "$pattern" ] && git rm -r --cached "$pattern" 2>/dev/null || true
            done < "$GITHUB_WORKSPACE/.syncignore"
          fi

          # =========================
          # 🔥 STEP 4: APPLY NEW SNAPSHOT
          # =========================
          echo "📦 Applying filtered files..."

          rsync -av --delete ../clean/ ./

          # =========================
          # 🔥 STEP 5: COMMIT ONLY IF CHANGE
          # =========================
          git add .

          if git diff --cached --quiet; then
            echo "❌ No changes detected"
          else
            git commit -m "🚀 Smart Sync (filtered files only)"
            git push origin main
          fi

          echo "🎉 Smart Sync Completed!"
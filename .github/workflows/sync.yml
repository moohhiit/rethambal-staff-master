name: Smart Sync (Independent + Filtered)
on:
  push:
    branches:
      - main
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Smart Sync to GitLab
        env:
          GITLAB_REPO: ${{ secrets.GITLAB_REPO_URL }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          echo "🚀 Smart Sync Started..."

          # =========================
          # STEP 1: PREPARE CLEAN SNAPSHOT
          # =========================
          mkdir clean

          rsync -av \
            --exclude='.git' \
            --exclude-from=".syncignore" \
            ./ clean/

          # Remove .git just in case (belt + suspenders)
          rm -rf clean/.git
          echo "✅ Clean snapshot ready"

          # =========================
          # STEP 2: CLONE GITLAB
          # =========================
          # Strip any leading https:// from the secret so we don't double it
          GITLAB_HOST="${GITLAB_REPO#https://}"

          git clone "https://oauth2:${GITLAB_TOKEN}@${GITLAB_HOST}" ../gitlab-repo
          cd ../gitlab-repo

          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

          # =========================
          # STEP 3: CLEAN GITLAB (only tracked ignored files)
          # =========================
          echo "🧹 Cleaning ignored files from GitLab..."
          if [ -f "$GITHUB_WORKSPACE/.syncignore" ]; then
            while IFS= read -r pattern; do
              # Skip blank lines and comments
              [[ -z "$pattern" || "$pattern" == \#* ]] && continue
              git rm -r --cached --ignore-unmatch "$pattern" 2>/dev/null || true
            done < "$GITHUB_WORKSPACE/.syncignore"
          fi

          # =========================
          # STEP 4: APPLY NEW SNAPSHOT (preserve GitLab-only files)
          # =========================
          echo "📦 Applying filtered files..."
          # No --delete: keeps files that exist only on GitLab
          rsync -av ../clean/ ./

          # =========================
          # STEP 5: COMMIT ONLY IF CHANGES
          # =========================
          git add .
          if git diff --cached --quiet; then
            echo "❌ No changes detected"
          else
            git commit -m "🚀 Smart Sync (filtered files only)"
            git push origin main
          fi

          echo "🎉 Smart Sync Completed!"
name: Smart Sync (Independent + Filtered)
on:
  push:
    branches:
      - main
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Smart Sync to GitLab
        env:
          GITLAB_REPO: ${{ secrets.GITLAB_REPO_URL }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          echo "🚀 Smart Sync Started..."

          # Capture absolute workspace path BEFORE any cd
          WORKSPACE="$GITHUB_WORKSPACE"
          CLEAN_DIR="$WORKSPACE/../clean"
          GITLAB_DIR="$WORKSPACE/../gitlab-repo"

          # =========================
          # STEP 1: PREPARE CLEAN SNAPSHOT
          # =========================
          mkdir -p "$CLEAN_DIR"

          rsync -av \
            --exclude='.git' \
            --exclude-from="$WORKSPACE/.syncignore" \
            "$WORKSPACE/" "$CLEAN_DIR/"

          rm -rf "$CLEAN_DIR/.git"
          echo "✅ Clean snapshot ready"

          # =========================
          # STEP 2: CLONE GITLAB
          # =========================
          GITLAB_HOST="${GITLAB_REPO#https://}"
          git clone "https://oauth2:${GITLAB_TOKEN}@${GITLAB_HOST}" "$GITLAB_DIR"

          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

          # =========================
          # STEP 3: CLEAN IGNORED FILES FROM GITLAB
          # =========================
          echo "🧹 Cleaning ignored files from GitLab..."
          cd "$GITLAB_DIR"

          if [ -f "$WORKSPACE/.syncignore" ]; then
            while IFS= read -r pattern; do
              [[ -z "$pattern" || "$pattern" == \#* ]] && continue
              git rm -r --cached --ignore-unmatch "$pattern" 2>/dev/null || true
            done < "$WORKSPACE/.syncignore"
          fi

          # =========================
          # STEP 4: APPLY NEW SNAPSHOT
          # =========================
          echo "📦 Applying filtered files..."
          # Use absolute paths — no relative ../clean confusion
          rsync -av "$CLEAN_DIR/" "$GITLAB_DIR/"

          # =========================
          # STEP 5: COMMIT ONLY IF CHANGES
          # =========================
          cd "$GITLAB_DIR"
          git add .
          if git diff --cached --quiet; then
            echo "❌ No changes detected"
          else
            git commit -m "🚀 Smart Sync (filtered files only)"
            git push origin main
          fi

          echo "🎉 Smart Sync Completed!"
name: Sync GitHub to GitLab (Final Stable)

on:
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync to GitLab
        env:
          GITLAB_REPO: gitlab.com/moohhiit/rethambal-slave.git
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          echo "🚀 Starting clean sync..."

          # Clone GitLab repo OUTSIDE workspace
          git clone https://oauth2:${GITLAB_TOKEN}@${GITLAB_REPO} ../gitlab-repo
          cd ../gitlab-repo

          # ✅ FIX: set git config AFTER entering repo
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

          # Add GitHub as remote
          git remote add github $GITHUB_SERVER_URL/$GITHUB_REPOSITORY || true
          git fetch github

          # Checkout main branch
          git checkout main

          # Merge GitHub changes (incremental)
          git merge github/main -X theirs --allow-unrelated-histories -m "🔄 Sync from GitHub"

          echo "🧹 Cleaning unwanted files..."

          # Remove ignored tracked files
          if [ -f "$GITHUB_WORKSPACE/.syncignore" ]; then
            while read pattern; do
              [ -n "$pattern" ] && git rm -r --cached "$pattern" 2>/dev/null || true
            done < "$GITHUB_WORKSPACE/.syncignore"
          fi

          # Extra cleanup
          git rm -r --cached .github 2>/dev/null || true
          git rm -r --cached gitlab-repo 2>/dev/null || true

          # Remove nested folder physically
          rm -rf gitlab-repo

          # Remove empty directories
          find . -type d -empty -delete

          # Sync files (only allowed ones)
          rsync -av --delete \
            --exclude-from="$GITHUB_WORKSPACE/.syncignore" \
            $GITHUB_WORKSPACE/ ./

          git add .

          if git diff --cached --quiet; then
            echo "✅ No changes to commit"
          else
            git commit -m "🚀 Sync + Clean from GitHub"
            git push origin main
          fi

          echo "🎉 Sync completed successfully!"